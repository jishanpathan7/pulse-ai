# ─── Local dev infrastructure ─────────────────────────────────────────────────
# Runs postgres + redis only. The API and web are run via pnpm dev.
#
# Usage:
#   docker compose up -d          # start infra
#   docker compose down           # stop infra
#   docker compose down -v        # stop + wipe volumes

services:

  postgres:
    image: postgres:16-alpine
    container_name: pulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB:       pulse_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulse -d pulse_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulse_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
